    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-mono: 'JetBrains Mono', monospace;
        --font-arabic: 'Noto Sans Arabic', sans-serif;
      }

      body {
        background-color: #000000;
        color: #ffffff;
        font-family: var(--font-mono);
        cursor: none;
        overflow-x: hidden;
        /* Smooth font and opacity transitions */
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), font-family 0.4s ease;
      }

      /* Global language-based font family application */
      html[lang="ar"] body {
        font-family: var(--font-arabic);
      }

      .lang-switching {
        opacity: 0 !important;
      }

      ::selection {
        background-color: #ffffff;
        color: #000000;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffffff;
      }

      /* CRT Flicker Animation */
      @keyframes flicker {
        0% { opacity: 0.8; transform: scaleY(1); }
        5% { opacity: 0.1; }
        10% { opacity: 0.8; }
        15% { opacity: 0.5; }
        20% { opacity: 0.9; transform: scaleY(1.01); }
        25% { opacity: 0.2; }
        30% { opacity: 0.8; }
        100% { opacity: 1; transform: scaleY(1); }
      }
      .crt-flicker {
        animation: flicker 0.2s ease-out;
      }

      /* Icon Spin Animation */
      @keyframes spin-once {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-once {
        animation: spin-once 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Binking Cursor Animation */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .terminal-cursor {
        display: inline-block;
        width: 1ch;
        height: 1.2em;
        background: white;
        margin-left: 4px;
        vertical-align: middle;
        animation: blink 0.8s step-end infinite;
      }

      /* Project Card Entrance */
      @keyframes revealUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .project-reveal {
        opacity: 0;
      }
      .project-reveal.visible {
        animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .custom-cursor {
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.1s ease-out;
      }
      .cursor-follower {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), width 0.3s, height 0.3s;
      }
      
      a:hover ~ .custom-cursor, button:hover ~ .custom-cursor {
        transform: scale(3);
      }
    </style>

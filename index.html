    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'JetBrains Mono', monospace;
        cursor: none;
        overflow-x: hidden;
      }
      .font-arabic {
        font-family: 'Noto Sans Arabic', sans-serif;
      }
      ::selection {
        background-color: #ffffff;
        color: #000000;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffffff;
      }

      /* CRT Flicker Animation */
      @keyframes flicker {
        0% { opacity: 0.8; transform: scaleY(1); }
        5% { opacity: 0.1; }
        10% { opacity: 0.8; }
        15% { opacity: 0.5; }
        20% { opacity: 0.9; transform: scaleY(1.01); }
        25% { opacity: 0.2; }
        30% { opacity: 0.8; }
        100% { opacity: 1; transform: scaleY(1); }
      }
      .crt-flicker {
        animation: flicker 0.2s ease-out;
      }

      .custom-cursor {
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.1s ease-out;
      }
      .cursor-follower {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), width 0.3s, height 0.3s;
      }
      
      a:hover ~ .custom-cursor, button:hover ~ .custom-cursor {
        transform: scale(3);
      }
    </style>
